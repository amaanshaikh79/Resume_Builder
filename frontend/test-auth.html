<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Auth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #4338CA;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <h1>🧪 Auth Test Page</h1>
    
    <div class="form-group">
        <label>Full Name:</label>
        <input type="text" id="name" value="Test User">
    </div>

    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" value="test@example.com">
    </div>

    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="password" value="Test123!@#">
    </div>

    <button onclick="testRegister()">Test Register</button>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testHealth()">Test Health</button>

    <div id="result"></div>

    <script>
        const API_URL = 'http://localhost:8000';

        function showResult(data, isError = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = JSON.stringify(data, null, 2);
            resultDiv.className = isError ? 'error' : 'success';
        }

        async function testHealth() {
            try {
                console.log('Testing health endpoint...');
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.json();
                console.log('Health response:', data);
                showResult({ status: 'Health check successful', data });
            } catch (error) {
                console.error('Health check failed:', error);
                showResult({ error: error.message }, true);
            }
        }

        async function testRegister() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                console.log('Attempting registration...', { name, email });
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, password })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    showResult({ 
                        status: 'Registration successful!',
                        access_token: data.access_token.substring(0, 50) + '...',
                        refresh_token: data.refresh_token.substring(0, 50) + '...'
                    });
                    
                    // Store tokens
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                } else {
                    showResult({ 
                        status: 'Registration failed',
                        error: data 
                    }, true);
                }
            } catch (error) {
                console.error('Registration error:', error);
                showResult({ 
                    status: 'Request failed',
                    error: error.message 
                }, true);
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                console.log('Attempting login...', { email });
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    showResult({ 
                        status: 'Login successful!',
                        access_token: data.access_token.substring(0, 50) + '...',
                        refresh_token: data.refresh_token.substring(0, 50) + '...'
                    });
                    
                    // Store tokens
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                } else {
                    showResult({ 
                        status: 'Login failed',
                        error: data 
                    }, true);
                }
            } catch (error) {
                console.error('Login error:', error);
                showResult({ 
                    status: 'Request failed',
                    error: error.message 
                }, true);
            }
        }

        // Test on page load
        window.onload = () => {
            testHealth();
        };
    </script>
</body>
</html>
